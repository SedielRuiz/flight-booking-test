<div class="reservations-container">
  <div class="search-card">
    <div class="icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#da0018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </div>
    
    <h2>Consultar Reserva</h2>
    <p>Ingresa tu código de reserva (Booking Code) para ver el detalle de tu vuelo.</p>
    
    <div class="input-group">
      <input 
        type="text" 
        [(ngModel)]="reservationCode" 
        placeholder="Ej. BKG-XXXXXXXX" 
        (keyup.enter)="onSearch()"
        [disabled]="isLoading">
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <button class="btn-primary" (click)="onSearch()" [disabled]="isLoading || !reservationCode.trim()">
      <span *ngIf="isLoading">Buscando...</span>
      <span *ngIf="!isLoading">Consultar</span>
    </button>
  </div>
</div>
